# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "settings"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Headless desktop settings contracts, resolution and shared consumer"

[package.metadata.mixos]
component = "settings"
kind = "lib"
layer = "core"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[features]
default = []
# Reuses an app-owned native connection; never owns a runtime or receiver.
native = ["dep:bus", "dep:tokio"]

[dependencies]
bus = { workspace = true, optional = true, features = ["native"] }
tokio = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
design.workspace = true
thiserror.workspace = true

[dev-dependencies]
strict.workspace = true
