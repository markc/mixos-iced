[package]
name = "strict"
description = "The MixOS strict-data format: *.conf.mix data literals, loaded as data and never executed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "strict"
kind = "lib"
layer = "core"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
# Maps keep insertion order: a config file reads back in the order it was written.
indexmap = "=2.14.1"
# The runtime traits only; consumers bring their own `derive`.
serde = "=1.0.229"
# `to_json` / `from_json` for consumers that work on JSON trees. Never enable
# `preserve_order` here: the workspace relies on serde_json's sorted keys.
serde_json = "=1.0.151"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
