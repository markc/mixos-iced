[package]
name = "toolkit"
description = "iced widgets: text field, menus, audio controls, waveform, piano roll, a token-driven iced theme, font sets, icon fonts and freedesktop icon lookup"
# A public contract with its own version (CHANGELOG.md); the edition and
# toolchain are stated here so the crate carries them when taken elsewhere.
version = "0.2.5"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "toolkit"
kind = "lib"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

# The library uses iced's component crates only. The `iced` umbrella always
# links iced_winit and winit, so it is reachable solely through the gallery
# features, for the examples.
[features]
default = []
# Eager raster decoding (`images`). iced's workspace turns the `image`
# crate on with no codecs, so the png codec is enabled here too: a
# standalone `cargo test -p toolkit` must decode its fixtures.
image = ["iced_graphics/image", "iced_widget/image", "dep:image", "image/png", "dep:resvg"]
# Styles iced's `svg` widget too (`iced_widget/svg`).
svg = ["iced_widget/svg"]
wgpu = ["iced_renderer/wgpu-bare", "iced_renderer/geometry", "dep:iced_wgpu"]
tiny-skia = ["iced_renderer/tiny-skia", "iced_renderer/geometry"]
i18n = ["dep:fluent-bundle"]
gallery = ["dep:iced", "i18n"]
gallery-wgpu = ["gallery", "wgpu", "iced/wgpu-bare"]
gallery-tiny-skia = ["gallery", "tiny-skia", "iced/tiny-skia"]
# Test-only selection of the font registration guard suite
# (`tests/font_registration.rs`); no production code branch.
font-registration-guards = []

[dependencies]
iced_core = { workspace = true, features = ["advanced"] }
iced_futures = { workspace = true }
iced_widget = { workspace = true }
iced_graphics = { workspace = true, features = ["geometry"] }
iced_renderer = { workspace = true }
iced_runtime = { workspace = true }
iced_wgpu = { workspace = true, optional = true, features = ["geometry"] }
iced = { workspace = true, optional = true, features = ["advanced", "canvas", "wayland", "x11", "thread-pool", "fira-sans"] }
fluent-bundle = { version = "0.15", optional = true }
image = { workspace = true, optional = true }
resvg = { version = "=0.45.1", default-features = false, optional = true }
# `slide_bar` steps generic numeric values; the version is already in the lock.
num-traits = { workspace = true }
# `elide` walks grapheme boundaries; the version is already in the lock.
unicode-segmentation = "1.13"

[dev-dependencies]
edit = { path = "../edit" }
iced_tiny_skia = { workspace = true, features = ["wayland"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
unicode-width = "=0.2.2"
# Tests shape real text; iced's embedded Fira Sans means no host font is read.
iced_graphics = { workspace = true, features = ["fira-sans"] }
# `tests/snapshots.rs` renders the gallery offscreen with iced's headless
# simulator and reads the PNGs it writes back.
iced_test = { workspace = true }
png = { version = "=0.18.1" }
# The `generic` gate reads `cargo metadata`.
serde_json = { workspace = true }
# The requester round-trips a temp directory.
tempfile = { workspace = true }
# The font registration guard suite compiles the seam test sources from the
# patched cosmic-text package; the root patch resolves this to that package.
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }

[[example]]
name = "gallery"
required-features = ["gallery"]

[[example]]
name = "gallery_fonts"
required-features = ["gallery"]

[[example]]
name = "shell"
required-features = ["gallery"]

[[example]]
name = "compounds"
required-features = ["gallery"]

[[test]]
name = "shell"
required-features = ["gallery-tiny-skia"]

[[test]]
name = "compounds"
required-features = ["gallery-tiny-skia"]

[[test]]
name = "interactions"
required-features = ["gallery-tiny-skia"]

[[test]]
name = "pickers"
required-features = ["gallery-tiny-skia"]

# Offscreen gallery snapshots: `cargo test -p toolkit --features gallery-tiny-skia --test snapshots`.
[[test]]
name = "snapshots"
required-features = ["gallery-tiny-skia"]

# Dialog and toast snapshots plus keyboard-driven runs of the gallery page.
[[test]]
name = "services"
required-features = ["gallery-tiny-skia"]

# The font registration guard suite: the cosmic seam guard sources plus the
# iced wrapper assertions, against the toolkit's own resolved graph.
[[test]]
name = "font_registration"
required-features = ["font-registration-guards"]
