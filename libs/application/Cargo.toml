[package]
name = "application"
version = "0.1.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared native application bootstrap and renderer support"

[package.metadata.mixos]
component = "application"
kind = "lib"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[features]
default = []
tiny-skia = ["iced/tiny-skia", "dep:iced_tiny_skia"]
native-grid = ["tiny-skia", "image"]
image = ["iced/image", "iced_tiny_skia?/image"]
wgpu = ["iced/wgpu"]
wgpu-bare = ["iced/wgpu-bare"]
raster-probe = ["tiny-skia", "iced_tiny_skia/raster-probe"]
test-support = ["dep:iced_test"]
settings = ["dep:settings", "dep:appearance", "dep:design", "dep:toolkit"]
settings-native = ["settings", "settings/native", "dep:tokio", "dep:bus"]
settings-cache = ["settings-native", "settings/cache", "dep:config", "dep:serde"]

[dependencies]
iced = { workspace = true, features = ["advanced", "crisp", "thread-pool", "wayland"] }
iced_runtime.workspace = true
iced_program.workspace = true
iced_tiny_skia = { workspace = true, optional = true, features = ["wayland"] }
iced_test = { workspace = true, optional = true }
settings = { workspace = true, optional = true }
appearance = { workspace = true, optional = true }
design = { workspace = true, optional = true }
toolkit = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
bus = { workspace = true, optional = true, features = ["native"] }
config = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
png = "=0.18.1"
bus = { workspace = true, features = ["native"] }
serde_json.workspace = true
