[package]
name = "application"
version = "0.1.18"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared native application bootstrap and renderer support"

[package.metadata.mixos]
component = "application"
kind = "lib"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[features]
default = []
tiny-skia = ["iced/tiny-skia", "dep:iced_tiny_skia"]
native-grid = ["tiny-skia", "image"]
image = ["iced/image", "iced_tiny_skia?/image"]
wgpu = ["iced/wgpu"]
wgpu-bare = ["iced/wgpu-bare"]
raster-probe = ["tiny-skia", "iced_tiny_skia/raster-probe"]
# Developer-only actual native frame ordering acceptance, absent from defaults.
native-frame-probe = ["iced/native-frame-probe"]
test-support = ["dep:iced_test", "iced/selector"]
settings = ["dep:settings", "dep:appearance", "dep:design", "dep:toolkit", "appearance/resources"]
settings-native = ["settings", "settings/native", "dep:tokio", "dep:bus", "dep:assets"]
settings-cache = ["settings-native", "settings/cache", "dep:config", "dep:serde"]
# Read-only layout inspection; enables the narrow selector-only iced query
# support. Not in defaults.
native-inspect = ["iced/selector"]
# The native acceptance facade and bounded operation barrier, on top of
# native-inspect, using the existing optional Bus, serde_json and tokio
# dependencies. Does not force a GPU backend or a settings feature. Not in
# defaults.
acceptance = ["native-inspect", "dep:bus", "dep:tokio", "dep:serde_json"]

[dependencies]
iced = { workspace = true, features = ["advanced", "crisp", "thread-pool", "wayland"] }
iced_runtime.workspace = true
iced_program.workspace = true
iced_tiny_skia = { workspace = true, optional = true, features = ["wayland"] }
iced_test = { workspace = true, optional = true }
settings = { workspace = true, optional = true }
appearance = { workspace = true, optional = true }
design = { workspace = true, optional = true }
toolkit = { workspace = true, optional = true }
# The resource host's captured lookup policy on the worker lane.
assets = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
bus = { workspace = true, optional = true, features = ["native"] }
config = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
png = "=0.18.1"
bus = { workspace = true, features = ["native"] }
serde_json.workspace = true
blake3 = "=1.8.6"
hex = "=0.4.3"
sha2 = { workspace = true }
strict = { path = "../strict" }
