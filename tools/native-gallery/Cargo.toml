[package]
name = "native-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "native-gallery"
kind = "tool"
layer = "desktop"
contract = "none"

[features]
default = ["gallery-tiny-skia", "image"]
gallery = []
gallery-tiny-skia = ["gallery", "tiny-skia", "toolkit/gallery-tiny-skia"]
tiny-skia = ["toolkit/tiny-skia"]
wgpu = ["toolkit/wgpu"]
gallery-wgpu = ["gallery", "wgpu", "toolkit/gallery-wgpu"]
image = ["toolkit/image"]
frame-probes = ["dep:winit", "dep:softbuffer"]
native-frame-probe = ["gallery-tiny-skia", "iced/native-frame-probe"]

[[bin]]
name = "native-frame-iced-probe"
path = "src/bin/native-frame-iced-probe.rs"
required-features = ["native-frame-probe"]

[[bin]]
name = "native-frame-winit-probe"
path = "src/bin/native-frame-winit-probe.rs"
required-features = ["frame-probes"]

[dependencies]
toolkit = { workspace = true }
iced = { workspace = true, features = ["advanced", "wayland", "thread-pool", "fira-sans"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
fluent-bundle = "0.15"
iced_futures = { workspace = true }
winit = { path = "../../vendor/winit", version = "0.30.8", optional = true, default-features = false, features = ["wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = { version = "=0.4.8", optional = true, default-features = false, features = ["wayland", "wayland-dlopen"] }

[lints.clippy]
mod_module_files = "deny"
