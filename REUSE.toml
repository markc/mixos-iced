# REUSE-format licence annotations (https://reuse.software/spec/), so every
# file is covered without a per-file header. A file that carries its own SPDX
# header keeps it ("closest" precedence). Checked by a Mix gate (AGENTS.md §4).
version = 1

[[annotations]]
path = "share/icons/material/**"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC (Material Symbols)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "libs/toolkit/tests/fixtures/terminal.svg"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC (Material Symbols)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "vendor/msedit/**"
precedence = "override"
