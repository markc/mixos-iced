# MixOS brand art (preliminary). Deliberately NOT under the code licence: the
# logo's licence is still to be decided. Decide it before a release.
[[annotations]]
path = "share/brand/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Mark Constable <mc@mixos.dev>"
SPDX-License-Identifier = "NOASSERTION"

