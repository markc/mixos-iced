# REUSE-format licence annotations (https://reuse.software/spec/), so every
# file is covered without a per-file header. A file that carries its own SPDX
# header keeps it ("closest" precedence). Checked by a Mix gate (AGENTS.md §4).
version = 1

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Mark Constable <mc@mixos.dev>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "services/compd/**"
precedence = "closest"
SPDX-FileCopyrightText = ["2026 Mark Constable <mc@mixos.dev>", "2026 Yarden Apelker"]
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "vendor/calloop/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2018 Victor Berger"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/cryoglyph/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "The cryoglyph and glyphon authors"
SPDX-License-Identifier = "MIT OR Apache-2.0 OR Zlib"

[[annotations]]
path = "vendor/font/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "vendor/iced/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2019 Héctor Ramón, Iced contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/input/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2017 Victor Brekenfeld"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/smithay/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2017 Victor Berger and Victoria Brekenfeld"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/wgpu/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 The gfx-rs developers"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["docs/web/fonts/icons.woff2", "docs/web/fonts/LICENSE-MaterialSymbols.txt"]
