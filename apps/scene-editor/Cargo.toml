[package]
name = "scene-editor"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Native scene gallery, management and panel arrangement"

[package.metadata.mixos]
component = "scene-editor"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
application = { workspace = true, features = ["tiny-skia", "settings-cache"] }
toolkit = { workspace = true, features = ["tiny-skia", "i18n"] }
appearance.workspace = true
settings = { workspace = true, features = ["native"] }
config.workspace = true
bus = { workspace = true, features = ["native"] }
buildinfo.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
application = { workspace = true, features = ["tiny-skia", "test-support"] }

[build-dependencies]
buildinfo.workspace = true
