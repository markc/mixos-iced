[package]
name = "busviewer"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Native ABP service browser and verb caller"

[package.metadata.mixos]
component = "busviewer"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
application = { workspace = true, features = ["tiny-skia", "settings-cache", "describe"] }
toolkit = { workspace = true, features = ["tiny-skia"] }
appearance.workspace = true
settings = { workspace = true, features = ["native"] }
config.workspace = true
bus = { workspace = true, features = ["native"] }
buildinfo.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true
fluent-bundle = "0.15"

[dev-dependencies]
application = { workspace = true, features = ["tiny-skia", "test-support"] }
term-test-broker = { path = "../term/crates/term-test-broker" }

[build-dependencies]
buildinfo.workspace = true
