[package]
name = "ced"
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Native Wayland editor over shared edit Bus buffers"

[package.metadata.mixos]
component = "ced"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
application = { workspace = true, features = ["tiny-skia"] }
toolkit = { workspace = true, features = ["tiny-skia"] }
design.workspace = true
appearance.workspace = true
editor-model = { path = "crates/editor-model" }
edit.workspace = true
bus = { workspace = true, features = ["native"] }
config.workspace = true
buildinfo.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
scene.workspace = true
sha2.workspace = true
rand.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
proptest = "1"
tempfile.workspace = true

[build-dependencies]
buildinfo.workspace = true
