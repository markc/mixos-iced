[package]
name = "term"
version = "0.3.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Wayland terminal with a banded CPU renderer and native Bus session control"

[package.metadata.mixos]
component = "term"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[features]
default = ["tiny-skia"]
raster-probe = ["tiny-skia", "iced_tiny_skia/raster-probe"]
wgpu = ["iced/wgpu"]
tiny-skia = ["iced/tiny-skia", "iced/image", "dep:bytes", "dep:iced_tiny_skia", "dep:tiny-skia"]

[build-dependencies]
buildinfo.workspace = true

[dependencies]
bytes = { version = "1.12", optional = true }
iced = { workspace = true, features = ["advanced", "crisp", "thread-pool", "wayland"] }
term-core = { path = "crates/term-core" }
design.workspace = true
config.workspace = true
toolkit.workspace = true
buildinfo.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
iced_tiny_skia = { workspace = true, optional = true, features = ["image", "wayland"] }
tiny-skia = { version = "0.11", optional = true, default-features = false, features = ["std", "simd"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time"] }
term-test-broker = { path = "crates/term-test-broker" }
bus = { workspace = true, features = ["native"] }
term-core = { path = "crates/term-core", features = ["test-support"] }
