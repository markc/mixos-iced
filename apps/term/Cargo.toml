[package]
name = "term"
version = "0.3.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Wayland terminal with a banded CPU renderer and native Bus session control"

[package.metadata.mixos]
component = "term"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[features]
default = ["tiny-skia"]
# The term stays on the explicit CPU renderer (application rendering
# decision): `wgpu` is opt-in only, never enabled by dependency unification
# with compd's GPU co-enable, so combined GPU builds keep the tiny-skia path.
raster-probe = ["tiny-skia", "application/raster-probe"]
wgpu = ["application/wgpu"]
tiny-skia = ["application/native-grid", "dep:bytes", "dep:tiny-skia"]

[build-dependencies]
buildinfo.workspace = true

[dependencies]
bytes = { version = "1.12", optional = true }
application = { workspace = true, features = ["settings-cache"] }
term-core = { path = "crates/term-core" }
appearance.workspace = true
config.workspace = true
settings = { workspace = true, features = ["native"] }
bus = { workspace = true, features = ["native"] }
toolkit = { workspace = true, features = ["i18n"] }
buildinfo.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tiny-skia = { version = "0.11", optional = true, default-features = false, features = ["std", "simd"] }

[dev-dependencies]
assets.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
term-test-broker = { path = "crates/term-test-broker" }
bus = { workspace = true, features = ["native"] }
term-core = { path = "crates/term-core", features = ["test-support"] }
