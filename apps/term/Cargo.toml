[package]
name = "term"
version = "0.3.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Wayland terminal with a banded CPU renderer and native Bus session control"

[package.metadata.mixos]
component = "term"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[features]
default = ["tiny-skia"]
raster-probe = ["tiny-skia", "application/raster-probe"]
wgpu = ["application/wgpu"]
tiny-skia = ["application/tiny-skia", "application/image", "dep:bytes", "dep:tiny-skia"]

[build-dependencies]
buildinfo.workspace = true

[dependencies]
bytes = { version = "1.12", optional = true }
application.workspace = true
term-core = { path = "crates/term-core" }
design.workspace = true
appearance.workspace = true
config.workspace = true
toolkit = { workspace = true, features = [] }
buildinfo.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tiny-skia = { version = "0.11", optional = true, default-features = false, features = ["std", "simd"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time"] }
term-test-broker = { path = "crates/term-test-broker" }
bus = { workspace = true, features = ["native"] }
term-core = { path = "crates/term-core", features = ["test-support"] }
