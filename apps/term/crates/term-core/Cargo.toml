[package]
name = "term-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Term's headless PTY, VT grid, raster, panes and native Bus session control"

[package.metadata.mixos]
component = "term"
kind = "app"
layer = "core"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[features]
test-support = []

[dependencies]
assets.workspace = true
design.workspace = true
fontdb = "=0.23.0"
bus = { workspace = true, features = ["native"] }
config.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }
# Child-only descriptor handoff; guarded revision and hunks in vendor/teletypewriter.
rio-vt = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442", default-features = false, features = ["pty"] }
teletypewriter = { git = "https://github.com/raphamorim/rio", rev = "932c1a7d9e07b4db5924f7a0dd689e823c3a1442", default-features = false }
swash = "0.2.10"
libc.workspace = true
ed25519-dalek = { workspace = true, features = ["zeroize"] }
zeroize = "1"
sha2.workspace = true
buildinfo.workspace = true

[dev-dependencies]
png = "0.18.1"
term-test-broker = { path = "../term-test-broker" }
