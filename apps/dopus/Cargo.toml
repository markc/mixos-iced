[package]
name = "dopus"
version = "0.4.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Native Wayland twin-pane file manager"

[package.metadata.mixos]
component = "dopus"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
application = { workspace = true, features = ["tiny-skia", "image", "settings-cache"] }
settings = { workspace = true, features = ["native"] }
toolkit = { workspace = true, features = ["tiny-skia", "i18n"] }
design.workspace = true
appearance.workspace = true
dopus-core = { path = "crates/dopus-core" }
bus = { workspace = true, features = ["native"] }
config.workspace = true
buildinfo.workspace = true
actions = { path = "crates/actions" }
resvg = "=0.47.0"
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
chrono = { workspace = true, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
iced-tiny-skia-pixels = { package = "tiny-skia", version = "=0.11.4", default-features = false, features = ["std"] }

[build-dependencies]
buildinfo.workspace = true
