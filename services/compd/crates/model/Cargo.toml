# No tokio/tonic/prost: logging goes to stderr (journald), not a gRPC stream.

[package]
name = "model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.mixos]
component = "compd"
kind = "service"
layer = "desktop"
contract = "none"

[lints]
workspace = true

[features]
default = ["error", "warn", "info", "trace"]
error = []
info = []
trace = []
warn = []

[dependencies]
bitflags = { workspace = true }
crossbeam-channel = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

