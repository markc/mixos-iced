[package]
name = "scene-host"
description = "Mix Scenes host for compd: the shell.scene.* verbs, its own Bus registration, and the iced renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "compd"
kind = "service"
layer = "desktop"
contract = "none"

[lints]
workspace = true

[dependencies]
# conf.mix (strict data) and its path in the MixOS etc dir, as Quoin reads them.
config = { workspace = true }
# The design-token palette the chrome theme already compiled.
decor = { workspace = true }
# Edge furniture resolves the shared design in dark mode, as Quoin does.
design = { workspace = true }
# RedrawReason::Publish.
dispatcher = { workspace = true }
# The surfaces: compositor-owned iced instances in the world registry.
ui = { workspace = true }
world = { workspace = true }
iced_core = { workspace = true }
iced_widget = { workspace = true, features = ["wgpu"] }
iced_graphics = { workspace = true, features = ["image"] }
# Packaged icons such as Rio embed PNGs inside their SVG.
iced_wgpu = { workspace = true, features = ["svg-raster-images"] }
# The freedesktop icon-theme resolver (`toolkit::icons::freedesktop`).
toolkit = { workspace = true }
smithay = { workspace = true }
# The engine-neutral Mix Scenes core: parse, lint, resolve, diff, describe,
# bindings.
scene = { workspace = true }
# Quoin's panel model: one active page per edge, modes, motion.
edges = { workspace = true }
# The host's own Bus registration (`shell`), separate from the comp port.
bus = { workspace = true, features = ["client"] }
serde_json = { workspace = true }
# The scene digest (`shell.scene.watch`), as Quoin computes it.
sha2 = { workspace = true }
# A current-thread runtime on the host's worker thread, as comp-service runs one.
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The same CPU SVG parser/rasteriser and embedded-image support as iced_wgpu.
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
