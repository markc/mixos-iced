[package]
name = "comp-service"
description = "Native Bus transport for compd's comp service: ingress, admission, worker, publisher, engine service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "compd"
kind = "service"
layer = "desktop"
contract = "none"

[dependencies]
comp-model.workspace = true
surfaces.workspace = true
bus = { workspace = true, features = ["client"] }
crossbeam-channel.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
