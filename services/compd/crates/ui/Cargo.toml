[package]
name = "ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.mixos]
component = "compd"
kind = "service"
layer = "desktop"
contract = "none"

[lints]
workspace = true

[dependencies]
# The pinned font, icon and emoji set the UI fonts come from (src/font/default).
assets = { workspace = true }
dispatcher = { workspace = true }
graphics = { workspace = true }
# FrameSource: the per-frame report content sources (src/source.rs) hand the presentation ledger.
ledger = { workspace = true }
model = { workspace = true }
bitflags = { workspace = true }
iced_core = { workspace = true }
iced_graphics = { workspace = true }
iced_runtime = { workspace = true }
iced_wgpu = { workspace = true }
smithay = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
# tests/fonts.rs publishes a fake asset set: the manifest is JSON (strict
# data) with a SHA-256 and a BLAKE3 per file, in a temporary directory.
blake3 = { version = "=1.8.6" }
hex = { version = "=0.4.3" }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { version = "=3.27.0" }
