# SPDX-License-Identifier: MIT OR Apache-2.0
# Enforce the permissive dependency policy in AGENTS.md.
[licenses]
allow = [
  "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0",
  "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0",
  "NCSA", "OpenSSL", "Unicode-DFS-2016", "Unicode-3.0", "Unlicense", "Zlib",
]

[bans]
multiple-versions = "warn"
deny = [
  { crate = "wgpu", deny-multiple-versions = true },
  { crate = "iced", deny-multiple-versions = true },
  { crate = "bevy", deny-multiple-versions = true },
  { crate = "smithay", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Existing Term substrate; manifests pin its complete revision.
allow-git = ["https://github.com/raphamorim/rio"]
required-git-spec = "rev"
